name: Playground preview

# Adds a "Preview in Playground" button to each pull request's description.
# Playground loads the plugin at the PR head commit, so this needs the
# committed build/ to be current (CI checks that) and no Composer packages at
# runtime. Fork and Dependabot PRs get a read-only token and are skipped.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: playground-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Add the Playground preview button
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: WordPress/action-wp-playground-pr-preview@1b15093d61b5e98cdfeb31466f34ade495762cd7 # v4.0.0
        with:
          mode: append-to-description
          github-token: ${{ secrets.GITHUB_TOKEN }}
          blueprint: |
            {
              "$schema": "https://playground.wordpress.net/blueprint-schema.json",
              "preferredVersions": {
                "php": "8.2",
                "wp": "latest"
              },
              "steps": [
                {
                  "step": "installPlugin",
                  "pluginData": {
                    "resource": "url",
                    "url": "https://codeload.github.com/${{ github.repository }}/zip/${{ github.event.pull_request.head.sha }}"
                  },
                  "options": {
                    "activate": true,
                    "targetFolderName": "post-kinds-for-indieweb-in-block-themes"
                  }
                },
                {
                  "step": "importWxr",
                  "file": {
                    "resource": "url",
                    "url": "https://raw.githubusercontent.com/courtneyr-dev/indieweb-test-data/62a8dbc66bd0814ea720bd23f3893a16d499ff20/indieweb-test-data-small.xml"
                  }
                }
              ]
            }
