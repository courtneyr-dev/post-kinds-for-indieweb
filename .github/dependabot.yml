version: 2
updates:
  # PHP dependencies (Composer)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      php-dev-dependencies:
        patterns:
          - "*"
        dependency-type: "development"
    labels:
      - "dependencies"
      - "php"
    commit-message:
      prefix: "chore(deps)"

  # JavaScript dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      wordpress-packages:
        patterns:
          - "@wordpress/*"
      js-dev-dependencies:
        patterns:
          - "*"
        dependency-type: "development"
        exclude-patterns:
          - "@wordpress/*"
    ignore:
      # @wordpress/babel-preset-default (and the Jest preset built on it)
      # requires Babel 7; Babel 8 breaks every Jest suite. Lift this once
      # the WordPress preset supports Babel 8.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
